# AuK-Flash: independent stage engine loops, async full-payload transport.
# Two GPUs are the default to isolate Thinker encoding from active flow work.
pipeline: auk
async_chunk: false
connectors:
  condition_shm:
    name: SharedMemoryConnector
    extra:
      codec_streaming: false
stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    gpu_memory_utilization: 0.5
    max_num_batched_tokens: 4096
    max_model_len: 4096
    enable_prefix_caching: false
    enforce_eager: true
    async_scheduling: false
    dtype: bfloat16
    output_connectors:
      to_stage_1: condition_shm
    default_sampling_params:
      max_tokens: 1
      detokenize: false
    tokenizer: Qwen/Qwen2.5-Omni-3B
    skip_tokenizer_init: false
    limit_mm_per_prompt:
      audio: 1
      image: 0
      video: 0


  - stage_id: 1
    devices: "0"
    max_num_seqs: 8
    max_num_batched_tokens: 4096
    max_model_len: 4096
    skip_tokenizer_init: true
    enable_prefix_caching: false
    enforce_eager: true
    async_scheduling: false
    dtype: bfloat16
    input_connectors:
      from_stage_0: condition_shm
    default_sampling_params:
      max_tokens: 1
      detokenize: false
